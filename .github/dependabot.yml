# Weekly update pull requests for npm packages and pinned GitHub Actions.
# Security updates (opened as soon as an advisory is published) use the same settings.
#
# Commit messages use the "build" type, which semantic-release does not release on.
# To ship a dependency fix, merge it with a "fix(deps): …" squash title instead.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tasks/PublishPlaywrightBddReport
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age a week before proposing them
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The pipeline task runs on the agent's Node16/Node20 handlers (task.json), so its
      # Node typings must not describe newer APIs. Raise this with the task's runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      semantic-release:
        patterns: ["semantic-release", "@semantic-release/*", "conventional-changelog-*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
