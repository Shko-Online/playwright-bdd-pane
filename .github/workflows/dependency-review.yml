name: Dependency review

# Fails a pull request that adds a dependency with a known high or critical vulnerability.
# Only changes in the pull request are judged; vulnerabilities already on main are reported
# by Dependabot alerts instead.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The extension's front end is bundled from devDependencies, so those ship too.
          fail-on-scopes: runtime, development
